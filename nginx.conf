# Sirve la SPA: cualquier ruta que no sea un archivo devuelve index.html, para que
# las rutas del cliente (/invoicing/<id>, /finance...) funcionen al recargar.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Los archivos de assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
